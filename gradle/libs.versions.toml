[versions]
agp = "9.0.1"
kotlin = "2.3.20"
ferrostar = "0.58.0"
maplibre-compose = "0.13.0"
car-app-compose = "0.0.2"
androidx-car-app = "1.7.0"
androidx-core = "1.17.0"
androidx-lifecycle = "2.10.0"
androidx-activity-compose = "1.13.0"
androidx-datastore = "1.1.7"
compose-bom = "2026.02.01"
okhttp = "5.3.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
play-services-location = "21.3.0"
desugar-jdk-libs = "2.1.5"
junit = "4.13.2"

[libraries]
ferrostar-core = { module = "com.stadiamaps.ferrostar:core", version.ref = "ferrostar" }
ferrostar-ui-compose = { module = "com.stadiamaps.ferrostar:ui-compose", version.ref = "ferrostar" }
ferrostar-ui-maplibre = { module = "com.stadiamaps.ferrostar:ui-maplibre", version.ref = "ferrostar" }
ferrostar-google-play-services = { module = "com.stadiamaps.ferrostar:google-play-services", version.ref = "ferrostar" }
ferrostar-car-app = { module = "com.stadiamaps.ferrostar:car-app", version.ref = "ferrostar" }
ferrostar-ui-maplibre-car-app = { module = "com.stadiamaps.ferrostar:ui-maplibre-car-app", version.ref = "ferrostar" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose-android", version.ref = "maplibre-compose" }
car-app-compose = { module = "io.github.rallista:car-app-compose", version.ref = "car-app-compose" }
androidx-car-app = { module = "androidx.car.app:app", version.ref = "androidx-car-app" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
